name: JEV review

on:
  pull_request:

permissions:
  contents: read
  pull-requests: write

jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - name: Check out complete history
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24"
          cache: npm

      - name: Bundle the local action
        run: npm ci && npm run build

      - name: Review changed JavaScript and TypeScript
        id: jev
        uses: ./
        with:
          api-key: ${{ secrets.TYPESAFE_API_KEY }}

      - name: Use JEV outputs
        if: always()
        run: |
          echo "check-passed=${{ steps.jev.outputs.check-passed }}"
          echo "conclusion=${{ steps.jev.outputs.conclusion }}"
          echo "has-findings=${{ steps.jev.outputs.has-findings }}"
          echo "findings=${{ steps.jev.outputs.findings-count }}"
          echo "blocking=${{ steps.jev.outputs.blocking-findings-count }}"
          echo "followed=${{ steps.jev.outputs.followed-signals }}"
          echo "comment=${{ steps.jev.outputs.comment-url }}"
          echo "report=${{ steps.jev.outputs.report-path }}"
