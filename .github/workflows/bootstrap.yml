name: Bootstrap release

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  bootstrap:
    if: github.actor == 'fewhnhouse'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          cache: npm
      - name: Restore reviewed source tree
        run: |
          base64 --decode _bootstrap/source.tar.gz.b64 > /tmp/source.tar.gz
          tar -xzf /tmp/source.tar.gz
          rm -rf _bootstrap .github/workflows/bootstrap.yml
      - run: npm ci
      - run: npm run check
      - run: npm run build
      - name: Commit release
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'feat: release staged JEV review action'
          git tag -a v1.0.0 -m 'JEV Review Action v1.0.0'
          git tag v1
          git push origin main v1 v1.0.0
