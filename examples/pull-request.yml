name: JEV review

on:
  pull_request:

permissions:
  contents: read
  pull-requests: write

jobs:
  review:
    runs-on: ubuntu-latest
    outputs:
      conclusion: ${{ steps.jev.outputs.conclusion }}
      has-findings: ${{ steps.jev.outputs.has-findings }}
    steps:
      - name: Check out complete history
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0

      - name: Review changed JavaScript and TypeScript
        id: jev
        uses: fewhnhouse/jev-review-action@v1
        with:
          api-key: ${{ secrets.TYPESAFE_API_KEY }}
          # Optional TypeSafe-compatible gateway, for example a Vercel proxy:
          # api-base-url: ${{ vars.JEV_API_BASE_URL }}
          # api-model: jev-latest
          fail-on-severity: "2"
          # Category bars default to 0.8; min-confidence defaults to 0.7.
          # Set none to make a gate informational:
          # fail-on-compatibility: none
          # min-confidence: none

      - name: Use JEV outputs in a follow-up step
        if: always()
        run: |
          echo "conclusion=${{ steps.jev.outputs.conclusion }}"
          echo "findings=${{ steps.jev.outputs.findings-count }}"
          echo "blocking=${{ steps.jev.outputs.blocking-findings-count }}"
          echo "followed=${{ steps.jev.outputs.followed-signals }}"
          echo "comment=${{ steps.jev.outputs.comment-url }}"
          echo "report=${{ steps.jev.outputs.report-path }}"

      - name: Flag request-changes findings
        if: steps.jev.outputs.conclusion == 'request_changes'
        run: echo "JEV requested changes on ${{ steps.jev.outputs.request-changes-count }} finding(s)"

      - name: Fail the follow-up job when a bar was crossed
        if: always() && steps.jev.outputs.check-passed == 'false'
        run: echo "JEV check failed under the configured bars"
